<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriTrack — Calorie &amp; Weight Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Auth screen ===== -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand"><span class="logo">🥗</span><h1>NutriTrack</h1></div>
      <p class="auth-tagline">Track calories &amp; weight. Sign in to continue.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log in</button>
        <button class="auth-tab" data-tab="signup">Sign up</button>
      </div>

      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" required />
        <button type="submit" class="primary-btn wide">Log in</button>
        <p class="auth-error" id="loginError" role="alert" aria-live="polite"></p>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <input type="email" id="signupEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="signupPass" placeholder="Password (min 8 chars)" autocomplete="new-password" minlength="8" required />
        <input type="password" id="signupPass2" placeholder="Confirm password" autocomplete="new-password" required />
        <button type="submit" class="primary-btn wide">Create account</button>
        <p class="auth-error" id="signupError" role="alert" aria-live="polite"></p>
      </form>

      <p class="auth-note">Accounts are stored on the server; tracked data stays in this browser.</p>
    </div>
  </div>

  <!-- ===== App ===== -->
  <div id="app" class="hidden">
    <!-- Notification toast (login greeting, save errors, etc.) -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite">
      <span class="toast-ico" id="toastIco">👋</span>
      <span class="toast-text" id="toastText"></span>
      <button class="toast-close" id="toastClose" aria-label="Dismiss">×</button>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">&#9875;</span>
        <span class="brand-name">Port Traffic</span>
      </div>
      <div class="topbar-right">
        <span class="avatar" id="userAvatar">U</span>
        <span id="userName">user</span>
        <button id="logoutBtn" class="ghost-btn">Log out</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Container throughput by country, 2019</h2>
        <p class="panel-sub" id="chartSub">Loading&hellip;</p>
        <svg id="topCountriesChart" viewBox="0 0 600 320"></svg>
      </section>
    </main>
  </div>

  <script src="log.js"></script>
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
